<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArenaCash — Indique um amigo</title>
<style>
  :root {
    --blue-900: #0a1f44;
    --blue-700: #14336b;
    --blue-500: #1c5cff;
    --blue-300: #6fa1ff;
    --white: #ffffff;
    --off-white: #eaf1ff;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--blue-900);
  }

  .slides {
    width: 100%;
    height: 100vh;
  }

  .slide {
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Slide 1 — Capa */
  .slide--cover {
    background: linear-gradient(135deg, var(--blue-900) 0%, var(--blue-700) 55%, var(--blue-500) 100%);
    color: var(--white);
    text-align: center;
  }

  .slide--cover::before,
  .slide--cover::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
  }

  .slide--cover::before {
    width: 480px;
    height: 480px;
    top: -160px;
    right: -140px;
  }

  .slide--cover::after {
    width: 320px;
    height: 320px;
    bottom: -120px;
    left: -100px;
    background: rgba(255, 255, 255, 0.05);
  }

  .cover__content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    max-width: 780px;
    padding: 0 32px;
  }

  .cover__brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--off-white);
    opacity: 0.85;
  }

  .cover__brand-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--white);
    display: inline-block;
  }

  .cover__title {
    font-size: 64px;
    line-height: 1.08;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .cover__title span {
    color: var(--off-white);
  }

  .cover__subtitle {
    font-size: 22px;
    font-weight: 400;
    color: var(--off-white);
    opacity: 0.9;
    max-width: 560px;
    line-height: 1.5;
  }

  .cover__cta {
    margin-top: 12px;
    padding: 16px 40px;
    font-size: 17px;
    font-weight: 700;
    color: var(--blue-900);
    background: var(--white);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .cover__cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 34px rgba(0, 0, 0, 0.3);
  }

  .cover__cta:active {
    transform: translateY(0);
  }

  @media (max-width: 600px) {
    .cover__title {
      font-size: 40px;
    }

    .cover__subtitle {
      font-size: 18px;
    }
  }
</style>
</head>
<body>
  <main class="slides">
    <section class="slide slide--cover">
      <div class="cover__content">
        <div class="cover__brand">
          <span class="cover__brand-dot"></span>
          ArenaCash
        </div>
        <h1 class="cover__title">Indique um amigo <span>e ganhe R$ 50</span></h1>
        <p class="cover__subtitle">
          Compartilhe AGORA o ArenaCash com quem você confia. Quando seu amigo entrar, o bônus cai pra você.
        </p>
        <button class="cover__cta" type="button">Saiba mais</button>
      </div>
    </section>
  </main>
</body>
</html>
